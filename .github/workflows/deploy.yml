name: Deploy Archiv to IONOS

# Lädt site/ nach rsg-boeblingen.de/archiv/ (IONOS-Pfad /new/archiv) – inkrementell:
# nur Dateien, die sich seit dem letzten Deploy geändert haben (Stand in /new/archiv/.deploy-sha),
# gelöschte Dateien werden auch auf dem Server gelöscht. Logik: scripts/deploy.py
# Die Bilder liegen NICHT im Repo – sie werden per SFTP nach /new/archiv/bilder hochgeladen.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy.yml', 'scripts/deploy.py']
  workflow_dispatch:
    inputs:
      voll:
        description: "Alles hochladen statt nur Änderungen (dauert ca. 20 Minuten)"
        type: boolean
        default: false

concurrency:
  group: deploy-archiv
  cancel-in-progress: false

jobs:
  sftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # ganze Historie, damit der Vergleich mit dem letzten Deploy klappt

      - name: sshpass installieren
        run: sudo apt-get install -y -qq sshpass

      - name: Deploy (nur Änderungen)
        env:
          SFTP_HOST: home115502871.1and1-data.host
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: /new/archiv
          VOLL: ${{ inputs.voll || 'false' }}
          BASIS_SHA: ${{ github.event.before }}
        run: python3 scripts/deploy.py
